<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme QA gallery</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#0b1018;color:#e8edf3;font:15px system-ui;padding:24px}header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px}h1{margin:0;font-size:23px}select{padding:9px;background:#182230;border:1px solid #536172;color:#fff;border-radius:6px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.sample{overflow:hidden;border:1px solid #354252;border-radius:10px;background:#111923}.sample h2{margin:0;padding:10px 12px;font-size:14px}.frame{height:235px;overflow:hidden}.sample iframe{border:0;width:640px;height:470px;transform:scale(.5);transform-origin:top left;pointer-events:none}.note{color:#aab9c9;max-width:900px;line-height:1.5}
</style><script defer src="../seasonal-theme.js?v=17"></script></head>
<body>
  <header><h1>Theme QA gallery</h1><label>Group <select id="group"><option value="legendary">Pokémon — 29</option><option value="handheld">Consoles — 7</option><option value="elemental">Evertale elements — 7</option><option value="other">Calendar, minerals & signature — 36</option></select></label><span id="count"></span></header>
  <p class="note">Static material previews; no roster or optimizer data is loaded. Open an individual preview to inspect its complete composition. Live pages still need interaction, responsive, and reduced-motion checks.</p>
  <main id="gallery" class="gallery"></main>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const select=document.getElementById('group'),gallery=document.getElementById('gallery');
      function render(){
        const rows=window.EvertaleTheme.listThemes().filter(row=>select.value==='other'?!['legendary','handheld','elemental'].includes(row.material):row.material===select.value);
        gallery.replaceChildren();
        for(const row of rows){
          const card=document.createElement('article');card.className='sample';
          const title=document.createElement('h2'),link=document.createElement('a');link.textContent=row.label;link.href='./theme-preview.html?theme='+row.key;link.style.color='inherit';title.append(link);
          const wrap=document.createElement('div');wrap.className='frame';
          const iframe=document.createElement('iframe');iframe.title=row.label;iframe.loading='lazy';iframe.src='./theme-preview.html?theme='+row.key;wrap.append(iframe);card.append(title,wrap);gallery.append(card);
        }
        document.getElementById('count').textContent=rows.length+' profiles';
      }
      select.addEventListener('change',render);render();
    });
  </script>
</body></html>
