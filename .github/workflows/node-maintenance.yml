name: Node 24 Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * 1"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".node-version"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "**/*.js"
      - "**/*.mjs"
      - "apkfiles/entries/runtime/**"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".node-version"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "**/*.js"
      - "**/*.mjs"
      - "apkfiles/entries/runtime/**"

permissions:
  contents: read

concurrency:
  group: node-24-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-javascript:
    name: Validate JavaScript on Node 24 LTS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm

      - name: Confirm runtime contract
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major!==24){throw new Error('Expected Node 24.x, received '+process.version)}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run JavaScript validation suites
        run: npm test
